name: CI

# Runs after every push to any branch (Rule 42 of rules.md).
#
# Three kinds of checks, split by processor architecture:
#   host    the unit tests (level U), natively on x86_64 and on AArch64, with gcc and clang;
#   qemu    the boot code and the test kernel in QEMU (level Q), where the x86_64 runner
#           checks the x86_64 platforms and the AArch64 runner checks the AArch64 platform.
# Level Q-KVM (/dev/kvm) and level M (hardware) stay local checks.
on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  host:
    name: host ${{ matrix.arch }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # A failure in one combination must not hide the result of the others.
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        compiler: [gcc, clang]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check that there is source code to build
        id: sources
        run: CI/check_sources.sh

      # On main every build failure is a failure. On other branches a build
      # that fails only because code of later stages is missing is reported as
      # a warning ("build incomplete"); see CI/classify_build_log.sh.
      - name: Build and test
        if: steps.sources.outputs.has_sources == 'true'
        env:
          CI_STRICT: ${{ github.ref == 'refs/heads/main' }}
        run: CI/build_and_test.sh ${{ matrix.compiler }}

      - name: Report that build and test were skipped
        if: steps.sources.outputs.has_sources != 'true'
        run: echo "::notice::Build and test skipped, because none of the source files listed in CMakeLists.txt exist yet."

  qemu:
    name: qemu ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            platforms: x86_64-uefi x86_64-bios
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platforms: aarch64-uefi
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install QEMU, the firmware, and the image tools
        run: CI/install_qemu_deps.sh ${{ matrix.arch }}

      - name: Small checks (font, serial-log checker)
        run: |
          python3 scripts/gen_font.py --check
          bash tests/qemu/test_check_serial.sh

      - name: Build and run the QEMU tests
        run: CI/qemu_tests.sh ${{ matrix.platforms }}
