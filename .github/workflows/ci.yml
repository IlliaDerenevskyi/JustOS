name: CI

# Runs after every push to any branch (Rule 42 of rules.md).
on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      # A failure with one compiler must not hide the result of the other.
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check that there is source code to build
        id: sources
        run: CI/check_sources.sh

      # On main every build failure is a failure. On other branches a build
      # that fails only because code of later stages is missing is reported as
      # a warning ("build incomplete"); see CI/classify_build_log.sh.
      - name: Build and test
        if: steps.sources.outputs.has_sources == 'true'
        env:
          CI_STRICT: ${{ github.ref == 'refs/heads/main' }}
        run: CI/build_and_test.sh ${{ matrix.compiler }}

      - name: Report that build and test were skipped
        if: steps.sources.outputs.has_sources != 'true'
        run: echo "::notice::Build and test skipped, because none of the source files listed in CMakeLists.txt exist yet."
